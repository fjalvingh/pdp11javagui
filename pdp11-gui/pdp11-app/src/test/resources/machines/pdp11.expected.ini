;#############################################################################
;# pdp.ini
;#
;# List of all registers of a small generic PDP-11
;#
;# use:         machine description file for PDP11GUI
;# file type:   Windows "INI" file, preprocessed by macro processor M4
;#
;# Section formed like "[Bits.*]" contain Bitfield-definitions,
;# all other sections contain device and register definitions.
;#
;# Addresses always are located in the I/O page.
;# They are always given as 16 bit addresses in the range 160000 to 177776
;# so the same device definition can be used for 16 bit, 18 bit and 22 bit machines
;# and there are not so many '7'-digits.
;#
;# If you want to override settings in the "Module_xxx() macros,
;# place your definitions AFTER the macro call. Example
;#      [LTC]
;#      Module_LTC                      << this is an M4 macro expanding to register definitions
;#      Info = "Line Time Clock on DL11-W (M7856)"
;# Overrides generic "Info =..." line in "Module_LTC" with own "Info=..."
;#

; List of some registers in a simple PDP-11
; Section formed like "[Bits.*]" contain Bitfield-definitions,
; all other sections contain device and register definitions.
;
; Addresses always are located in the I/O page.
; They are always given as 16 bit addresses in the range 160000 to 177776
; so the same device definition can be used for 16 bit, 18 bit and 22 bit machines
; and there are not so many '7'-digits.



;###############################################################################
;# pdp11.modules
;# PDP11 machine description module library to be included by machine description files (*.ini)
;#
;# - A machine consists of a bunch of "modules", plugged into a backplane and
;#   jumpered to some addresses.
;# - A module template is a description of a module, as given in DEC's documentation.
;# - A module instance is actual use of a module in a certain machine,
;#       which different parameters (most likely the base address) resolved.
;#   There may be more than one instance of a module in a machine,
;#      jumpered to different base adresses.
;#
;# Each module is given as a M4 macro.
;# a machine description file consists of a lot of module instances, each instance
;# calls the macro and substitutes some parameters.
;# Example: the Standard Serial Line Unit (SLU)
;#
;# 1) module template as M4 macro in "machine description module library" (pdp11.modules):
;#         $1 = baseaddr, $2 = info
;#         define(Module_SLU,`
;#         Info="Standard serial console terminal"
;#         RCSR= _offset($1,0) ;"Receiver Control/Status Register";Bits.CIM.RCSR
;#         RBUF= _offset($1,2) ;"Receiver Data Buffer";Bits.CIM.RBUF
;#         XCSR= _offset($1,4) ;"Transmitter Control/Status Register";Bits.CIM.TerminalXCSR
;#         XBUF= _offset($1,6) ;"Transmitter Buffer Register";Bits.CIM.XBUF        ')
;#
;# 2) module instance in a machine description file:
;#
;#         include(`pdp11.modules')
;#         ...
;#         [Console Terminal]
;#         Info="Serial console terminal and aux registers on CIM"
;#         Module_SLU(177560)
;#
;# 3) Resulting module description after M4 macro expansion:
;#         [Console Terminal]
;#         Info="Serial console terminal and aux registers on CIM"
;#         RCSR= 177560 ;"Receiver Control/Status Register";Bits.CIM.RCSR
;#         RBUF= 177562 ;"Receiver Data Buffer";Bits.CIM.RBUF
;#         XCSR= 177564 ;"Transmitter Control/Status Register";Bits.CIM.TerminalXCSR
;#         XBUF= 177566 ;"Transmitter Buffer Register";Bits.CIM.XBUF
;#
;#
;# ##############################################################################
;# Syntax
;# M4 Syntax is different from .INI-Files, so there are two levels of syntax used:
;#
;# M4:
;#       comments are '#'
;#       Strings are `...'
;#  IN MACRO EXPANSION neither NO "'" is ALLOWED!
;#
;# final .ini-File:
;#       comments are ';', item separators are ';'
;#       Strings are "..."
;#
;#  So recommended Comment begins with ";#" ... works always for .ini and M4 level
;#
;# ##############################################################################
;# ######################## Revision history ####################################
;# ##############################################################################
;#
;#
;#
;#
;# 31.7.2010:    V1.00
;#               Initial version, port from old machine description files.


;###############################################################################
;######################### Auxillary M4 macros #################################
;###############################################################################
;
;# _offset(...) adds two octal numbers, which are given without the leading '0'

;# (For M4, octal integers must be normally prefixed with a '0')


;###############################################################################
;############################# start of module library #########################
;###############################################################################

; Section formed like "[Bits.*]" contain Bitfield-definitions,
; all other sections contain device and register definitions.
;
; Addresses always are located in the I/O page.
; They are always given as 16 bit addresses in the range 160000 to 177776
; so the same device definition can be used for 16 bit, 18 bit and 22 bit machines
; and there are not so many '7'-digits.



;# machine description library of CPU-like modules


;################################################################################
;# Module_CPU - generic CPU, 11/44


[Bits.CPU.PSW]
Current Mode=15:14;"Current processor mode. 0=kernel,1=supervisor,2=illegal,3=user mode"
Previous Mode=13:12;"Processor mode prior to last trap, irq oder PSW loading"
CIS Instruction Suspension=8;"1, when a CIS instruction is entered and completed"
Priority=7:5;"Current level of processor priority"
T=4;"Trap: when 1, trap to 14. Debugging."
N=3;Negative
Z=2;Zero
V=1;Overflow
C=0;Carry

[Bits.CPU.PIRQ]
PIRQ Level=15:9;"PIR7-PIR1 - interrupt request of given priority level"
PIA-Hi=7:5;"Program interrupt active, MSB"
PIA-Lo=3:1;"Program interrupt active, LSB"

[Bits.CPU.Error]
Data Transfer=15;"Monitors DATA TRAN line. 0 = UNIBUS transfer"
C1=14;"1 when UNIBUS control signal BS C1 is asserted"
Cache Restart=13;"1, when cache has restartet processor clock"
KTE=12;"1, when memory management error has occured"
Bus Error=11;"1, when access to non existing memory, or UNIBUS 20us timeout"
Parity Error=10;"1, when memory parity error"
AC LO=9;"UNIBUS AC LO asserted."
DC LO=8;"UNIBUS DC LO asserted."
Illegal Halt=7;"Halt instruction in user or supervisor mode"
Odd Address Error=6;"Program attempted a word reference on an odd address"
Memory Time-Out=5;"Read from non-existant memory. Does not include UNIBUS addresses"
UNIBUS Time-Out=4;"No response from UNIBUS within 20 µs"
Processor Initialize=3;"This bit monitors the processor initialize signal"
Stack Overflow=2;"Kernel hardware stack is less than octal 400"
CIM Power Failure=0;"DC power to the machine has exceeded voltage tolerance limit for more than 1.5 µs"



;################################################################################
;# Module_LTC - standard Line time clock


[Bits.LTC.LKS]
LTC INT MON=7;"Line Time Clock Monitor - set by line frequency and cleared by program"
LTC ENAB=6;"Line Time Clock Interrupt Enable. When set, starts an interrupt"



;# ROM modules on M9312 boot termiantor,
;# or on PDP11/44 UBI


;################################################################################
;# Module_M9312_ROM_IDs - ID words of boot roms on M9312




;################################################################################
;# Module_M9312 - CPU diagnostic and boot address switch on M9312


;################################################################################
;# Module_M9312_ROM_Boot
;# the ROMs on M9312 boot terminator.
;# One NS82S131 contains 256 4bit-nibbles = 128 bytes = 64 words
