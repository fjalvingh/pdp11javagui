#
# PDP-11 tools - https://tools.etc.to/
#
# The pdp11-web application runs in its own Tomcat 11 instance on this machine, in /env/tools,
# started by tomcat11@tools.service and listening on 127.0.0.1:8088. Apache terminates TLS and
# proxies everything to it. Kept in the pdp11javagui repository as deploy/pigalle/040-tools.conf.
#
<IfModule mod_ssl.c>

#-- Everything on plain http is redirected to https.
<VirtualHost *:80>
	ServerName tools.etc.to
	ServerAdmin webmaster@etc.to

	ErrorLog ${APACHE_LOG_DIR}/tools-error.log

	RewriteEngine on
	RewriteCond %{SERVER_NAME} =tools.etc.to
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
	ServerName tools.etc.to
	ServerAdmin webmaster@etc.to

	ErrorLog ${APACHE_LOG_DIR}/tools-error.log
	CustomLog ${APACHE_LOG_DIR}/tools-access.log combined

	#-- The application must see the original host and scheme, so that the URLs it generates
	#-- point back at https://tools.etc.to/ and not at the Tomcat instance behind us. Tomcat
	#-- turns the header back into a secure request through the RemoteIpValve in its server.xml.
	ProxyPreserveHost on
	RequestHeader set X-Forwarded-Proto "https"

	#-- The application is the root context of that Tomcat instance, so the whole vhost is proxied.
	<Location />
		ProxyPass        http://127.0.0.1:8088/ retry=1 timeout=300
		ProxyPassReverse http://127.0.0.1:8088/
	</Location>

	SSLCertificateFile /etc/letsencrypt/live/tools.etc.to/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/tools.etc.to/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

</IfModule>
