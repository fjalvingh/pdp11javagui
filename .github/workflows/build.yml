name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to pwsh, where "./mvnw" would pick the POSIX launcher and
        # fail. Git Bash is present on every runner and the wrapper script handles msys.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # PLAN.md phase 0: CI on the three target platforms. macos-latest is arm64, so this
        # also covers the architecture the jpackage installers of phase 8 have to handle.
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # A couple of UI tests build a JFrame, which needs a display, and Linux runners have
      # none. Installing xvfb is all that is required: the root pom's xvfb profile activates on
      # the presence of xvfb-run and gives the Surefire fork a server of its own - the same path
      # a developer's machine takes, so what CI runs is what they ran. Windows and macOS runners
      # have a display and the profile does not activate there.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload the fat jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pdp11gui-jar
          path: pdp11-app/target/pdp11gui.jar
          if-no-files-found: error
